    <footer class="theme-section theme-bg-elevated px-6 py-12 md:px-10 lg:px-14">
      <div class="mx-auto flex max-w-[1400px] flex-col gap-8 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-3">
          <span class="footer-mark" aria-hidden="true"></span>
          <span class="font-heading theme-text text-lg font-semibold">Gbaski AI Services</span>
        </div>

        <nav class="flex flex-wrap gap-x-6 gap-y-2" aria-label="Footer navigation">
          @for (link of links; track link.href) {
            @if (link.route) {
              <a
                [routerLink]="link.href"
                class="font-mono-label theme-text-secondary footer-link text-[11px] tracking-[0.1em] no-underline"
              >
                {{ link.label }}
              </a>
            } @else {
              <a
                [href]="link.href"
                class="font-mono-label theme-text-secondary footer-link text-[11px] tracking-[0.1em] no-underline"
                (click)="scrollTo($event, link.href)"
              >
                {{ link.label }}
              </a>
            }
          }
        </nav>

        <p class="font-mono-label theme-text-secondary text-[11px] tracking-[0.08em]">
          © {{ year }} Gbaski AI Services
        </p>
      </div>
    </footer>
