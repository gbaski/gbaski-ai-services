<ul class="logo-strip" aria-label="Client logos">
  @for (client of clients; track client.name) {
    <li class="logo-strip__item">
      <img
        class="logo-strip__image"
        [src]="client.logo"
        [alt]="client.name + ' logo'"
        width="36"
        height="36"
        loading="lazy"
        decoding="async"
      />
      <span class="logo-strip__label">{{ client.name }}</span>
    </li>
  }
</ul>
