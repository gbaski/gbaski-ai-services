    <header class="site-header">
      <div class="site-header__inner mx-auto flex max-w-[1400px] items-center justify-between gap-4 px-4 py-4 sm:px-6 md:px-10 lg:px-14">
        <a
          href="/"
          class="site-header__brand inline-flex min-w-0 items-center gap-3 no-underline"
          (click)="goHome($event)"
        >
          <img
            src="/gbaski-logo.svg"
            alt="Gbaski AI Services logo"
            class="site-header__logo shrink-0"
            width="29"
            height="36"
            aria-hidden="true"
          />
          <span class="site-header__title font-heading theme-text truncate text-base font-semibold sm:text-lg">
            Gbaski AI Services
          </span>
        </a>

        <button
          type="button"
          class="theme-icon-btn shrink-0"
          (click)="themeService.toggle()"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          @if (themeService.theme() === 'dark') {
            <svg lucideSun [size]="18" [strokeWidth]="1.75" aria-hidden="true"></svg>
          } @else {
            <svg lucideMoon [size]="18" [strokeWidth]="1.75" aria-hidden="true"></svg>
          }
        </button>
      </div>
    </header>
