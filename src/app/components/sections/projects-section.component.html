    <div class="stacked-parallax" #stackRoot>
      <div class="stacked-parallax__track">
        <section id="projects" class="stacked-panel stacked-panel--intro stacked-panel--1" data-panel="intro">
          <div class="stacked-panel__inner panel-inner">
            <div
              class="project-panel__bg parallax-layer"
              data-pattern="mesh"
              data-speed="0.15"
              aria-hidden="true"
            ></div>
            <div class="stacked-panel__content mx-auto w-full max-w-[1400px] px-6 md:px-10 lg:px-14">
              <div class="stacked-panel__intro stacked-panel__intro--center">
                <p class="section-eyebrow mb-4">Case studies</p>
                <h2 class="stacked-panel__heading">
                  <span class="theme-text">Selected work in production</span>
                </h2>
                <p class="theme-text-muted projects-section__intro mt-6 max-w-3xl text-sm leading-relaxed md:text-base">
                  {{ pageIntro }}
                  Authenticated assistants, internal AI platforms, and n8n workflows, with dedicated case study pages for each.
                </p>
              </div>
            </div>
          </div>
        </section>

        @for (project of projects; track project.id; let i = $index) {
          <section
            [class]="'stacked-panel stacked-panel--project stacked-panel--' + (i + 2)"
            [attr.data-panel]="project.id"
          >
            <div class="stacked-panel__inner panel-inner">
              <div
                class="project-panel__bg parallax-layer"
                [attr.data-pattern]="patternFor(i)"
                data-speed="0.2"
                aria-hidden="true"
              ></div>
              <div class="stacked-panel__content mx-auto w-full max-w-[1400px] px-6 md:px-10 lg:px-14">
                <app-project-card [project]="project" />
              </div>
            </div>
          </section>
        }
      </div>
    </div>
