    <section id="platform" class="theme-section px-6 py-24 md:px-10 md:py-32 lg:px-14">
      <div class="mx-auto max-w-[1200px]">
        <p appScrollReveal class="section-eyebrow mb-4">Platform</p>
        <h2
          appScrollReveal
          [appScrollRevealDelay]="80"
          class="section-heading mb-16 max-w-3xl"
        >
          AI Services removes the complexity of building AI systems by bringing
          models and workflows into a unified platform built for scale and
          reliability.
        </h2>

        <div class="theme-grid grid sm:grid-cols-2 lg:grid-cols-3">
          @for (feature of features; track feature.title; let i = $index) {
            <article
              appScrollReveal
              [appScrollRevealDelay]="i * 60"
              class="feature-card theme-grid-item group p-8 md:p-10"
            >
              <h3 class="theme-text font-heading mb-3 text-lg font-semibold tracking-tight">
                {{ feature.title }}
              </h3>
              <p class="theme-text-muted text-sm leading-relaxed">
                {{ feature.description }}
              </p>
            </article>
          }
        </div>
      </div>
    </section>
