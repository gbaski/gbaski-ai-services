<section id="services" class="theme-section ai-services px-6 py-24 md:px-10 md:py-32 lg:px-14" aria-labelledby="services-heading">
  <div class="mx-auto max-w-[1400px]">
    <div class="ai-services__layout">
      <div class="ai-services__intro">
        <p appScrollReveal class="section-eyebrow mb-4">AI Services in Nigeria</p>
        <h2 id="services-heading" appScrollReveal [appScrollRevealDelay]="80" class="section-heading">
          Intelligent AI capabilities for Nigerian businesses
        </h2>
        <p appScrollReveal [appScrollRevealDelay]="120" class="section-body mt-5">
          We deliver AI services in Nigeria — automation, chatbots, voice agents, and custom integrations that connect to your tools, reduce manual work, and improve response times. Serving teams in {{ serviceAreas }}.
        </p>
      </div>

      <div appScrollReveal [appScrollRevealDelay]="200" class="ai-services__visual" aria-label="AI service capabilities">
        <app-services-column-marquee />
      </div>
    </div>
  </div>
</section>
