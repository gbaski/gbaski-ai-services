<section
  id="integrations"
  class="integrations-section relative px-6 py-24 md:px-10 md:py-32 lg:px-14"
  aria-labelledby="integrations-heading"
>
  <div class="relative z-10 mx-auto max-w-[1200px]">
    <div class="integrations-header mb-10 lg:mb-12">
      <p appScrollReveal class="section-eyebrow mb-4">Technology &amp; Integrations</p>
      <h2
        id="integrations-heading"
        appScrollReveal
        [appScrollRevealDelay]="80"
        class="section-heading mx-auto max-w-3xl"
      >
        Works with the tools you already run
      </h2>
      <p
        appScrollReveal
        [appScrollRevealDelay]="100"
        class="section-body theme-text-muted mx-auto mt-4 max-w-2xl"
      >
        Integrations with {{ integrationPlatforms }}.
      </p>
    </div>

    <ul class="integrations-grid" role="list" aria-label="Integration platforms">
      @for (item of logos; track item.name; let i = $index) {
        <li appScrollReveal [appScrollRevealDelay]="40 + i * 20" class="integrations-grid__item">
          <span class="integrations-grid__icon" aria-hidden="true">
            <img
              class="integrations-grid__logo"
              [src]="item.logo"
              alt=""
              width="24"
              height="24"
              loading="lazy"
              decoding="async"
            />
          </span>
          <span class="integrations-grid__name">{{ item.name }}</span>
        </li>
      }
    </ul>
  </div>
</section>
